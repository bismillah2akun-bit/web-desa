services:
  frontend:
    build: ./frontend
    container_name: profil-desa-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: profil-desa-backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: profil_desa
      DB_USER: profil_desa
      DB_PASSWORD: mysql123
      DB_RETRY_DELAY_MS: 3000
      DB_MAX_RETRIES: 20
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-development-secret-change-before-production}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-TanjungjayaAdmin123!}
      ADMIN_DISPLAY_NAME: ${ADMIN_DISPLAY_NAME:-Administrator Desa}
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    container_name: profil-desa-db
    environment:
      MYSQL_DATABASE: profil_desa
      MYSQL_USER: profil_desa
      MYSQL_PASSWORD: mysql123
      MYSQL_ROOT_PASSWORD: rootmysql123
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootmysql123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4.8.1
    container_name: profil-desa-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  mysql_data:
